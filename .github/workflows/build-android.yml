name: Tests and Android Build (APK)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'ArtSource/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.3.25f1
  BUILD_NAME: PingiPongi
  BUILDS_PATH: builds
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  test:
    name: Tests (EditMode + PlayMode)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Check Unity secrets are present (no printing)
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${UNITY_EMAIL}" ] || (echo "UNITY_EMAIL missing" && exit 1)
          [ -n "${UNITY_PASSWORD}" ] || (echo "UNITY_PASSWORD missing" && exit 1)
          [ -n "${UNITY_SERIAL}" ] || (echo "UNITY_SERIAL missing" && exit 1)
          echo "Secrets present."

      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-Test-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Test-${{ env.UNITY_VERSION }}-

      - name: Run EditMode and PlayMode tests
        uses: game-ci/unity-test-runner@v4.4.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          cliVersion: v0.1.69
          testMode: all
          coverageEnabled: false
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Test Results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results
          retention-days: 14
          if-no-files-found: ignore

  build-android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          sudo apt-get clean
          docker system prune -af --volumes
          df -h

      - name: Check Unity secrets are present (no printing)
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${UNITY_EMAIL}" ] || (echo "UNITY_EMAIL missing" && exit 1)
          [ -n "${UNITY_PASSWORD}" ] || (echo "UNITY_PASSWORD missing" && exit 1)
          [ -n "${UNITY_SERIAL}" ] || (echo "UNITY_SERIAL missing" && exit 1)
          echo "Secrets present."

      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-Android-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-${{ env.UNITY_VERSION }}-

      - name: Build Android APK
        uses: game-ci/unity-builder@v5
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: ${{ env.BUILD_NAME }}
          buildsPath: ${{ env.BUILDS_PATH }}
          versioning: Custom
          version: ${{ env.APP_VERSION }}
          androidVersionCode: ${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.BUILDS_PATH }}/Android/${{ env.BUILD_NAME }}.apk
          archive: false
          retention-days: 14
          if-no-files-found: error

      - name: Build summary
        shell: bash
        run: |
          APK="${{ env.BUILDS_PATH }}/Android/${{ env.BUILD_NAME }}.apk"
          {
            echo "### Pingi Pongi ${APP_VERSION}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | ${APP_VERSION} (code ${{ github.run_number }}) |"
            echo "| APK size | $(du -h "$APK" | cut -f1) |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
